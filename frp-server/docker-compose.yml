services:
  frps:
    image: ${FRP_IMAGE:-fatedier/frps:v0.68.0}
    container_name: ${FRP_CONTAINER_NAME:-frps}
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "${FRP_BIND_PORT:-7000}:${FRP_BIND_PORT:-7000}/tcp"
      - "${FRP_BIND_PORT:-7000}:${FRP_BIND_PORT:-7000}/udp"
    volumes:
      - ${FRP_CONFIG_PATH:-./generated/frps.toml}:/etc/frp/frps.toml:ro
